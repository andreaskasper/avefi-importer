# AVefi Importer — lokale Entwicklungsumgebung
#
#   docker compose up -d --build
#   docker compose exec web php app/bot.php -t seed     # Admin-User anlegen
#
#   App:      http://localhost:8080          (Login: admin@av-efi.net / changeme)
#   Adminer:  http://localhost:8081          (Postgres-Oberfläche statt phpMyAdmin)

services:
  web:
    build: ./Dockerfiles/web
    container_name: avefi_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html
      - ./db:/var/www/db:ro             # schema.sql für `bot -t migrate`
      - avefi_files:/mnt/files          # Uploads: /mnt/files/<import-uuid>/...
    environment:
      APP_ENV:    dev
      APP_HOST:   avefiimporter.goo1.de
      DB_HOST:    db
      DB_PORT:    "5432"
      DB_NAME:    avefi
      DB_USER:    avefi
      DB_PASS:    avefi
      FILES_PATH: /mnt/files
      # PID-Registrierung — noch nicht aktiv, von AVefi später zu konfigurieren
      # (siehe handbuch/06-pid-registrierung.md):
      # PID_ENDPOINT: ""
      # PID_PREFIX:   "21.11155"
      # PID_USER:     ""
      # PID_PASSWORD: ""
      # PID_DRYRUN:   "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: avefi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       avefi
      POSTGRES_USER:     avefi
      POSTGRES_PASSWORD: avefi
    volumes:
      - avefi_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avefi -d avefi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Worker-Daemon: pollt worker_jobs (detect/convert/download …). restart: always,
  # damit der Selbst-Neustart (7 Tage bzw. RAM > 1 GB) den Prozess wieder hochzieht.
  worker:
    build: ./Dockerfiles/web
    container_name: avefi_worker
    restart: always
    command: php app/bot.php -t worker
    working_dir: /var/www/html
    volumes:
      - ./html:/var/www/html
      - ./db:/var/www/db:ro
      - avefi_files:/mnt/files
    environment:
      APP_ENV:    dev
      DB_HOST:    db
      DB_PORT:    "5432"
      DB_NAME:    avefi
      DB_USER:    avefi
      DB_PASS:    avefi
      FILES_PATH: /mnt/files
    depends_on:
      db:
        condition: service_healthy

  # Adminer = leichtgewichtige DB-Oberfläche (Postgres-fähig), Ersatz für phpMyAdmin.
  adminer:
    image: adminer
    container_name: avefi_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      - db

volumes:
  avefi_pgdata:
  avefi_files:
